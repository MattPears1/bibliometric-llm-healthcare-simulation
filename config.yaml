# =============================================================================
# Bibliometric Analysis v2 - Configuration
# LLMs in Healthcare Simulation: A Bibliometric Analysis
# =============================================================================
# This file centralizes all configuration. Edit this, not the scripts.
# API keys are stored separately in .env (gitignored)
# =============================================================================

# --- Project Metadata ---
project:
  title: "Bibliometric Analysis of Large Language Models in Healthcare Simulation"
  version: 2
  date_created: "2026-03-22"
  authors:
    - name: "Matt Pears"
      role: "First Author"
    - name: "Shekhar"
      role: "Corresponding Author"

# --- Search Parameters ---
search:
  date_range:
    from_year: 2020
    to_year: 2026
  language: "en"

  # Keywords by category - used to build queries per source
  keywords:
    llm_terms:
      primary:  # High-precision terms
        - "large language model"
        - "large language models"
        - "LLM"
        - "ChatGPT"
        - "GPT-4"
        - "GPT-4o"
        - "GPT-3.5"
        - "GPT-5"
        - "Claude"
        - "Gemini"
        - "generative AI"
        - "generative artificial intelligence"
      secondary:  # Broader terms (may increase noise)
        - "artificial intelligence"
        - "AI chatbot"
        - "AI assistant"
        - "foundation model"
        - "transformer model"
        - "natural language processing"
      domain_specific:  # Medical AI models
        - "BioGPT"
        - "Med-PaLM"
        - "Med-PaLM 2"
        - "MedGPT"
        - "Llama"
        - "Llama 2"
        - "Llama 3"
        - "Mistral"
        - "GPT-4 Turbo"

    simulation_terms:
      primary:
        - "simulation"
        - "simulator"
        - "simulated patient"
        - "standardized patient"
        - "virtual patient"
        - "scenario-based"
        - "debriefing"
        - "simulation-based"
      secondary:
        - "high-fidelity simulation"
        - "low-fidelity simulation"
        - "in-situ simulation"
        - "mannequin"
        - "virtual reality"
        - "VR"
        - "mixed reality"
        - "XR"
        - "augmented reality"
        - "immersive"
        - "sim-based"
        - "OSCE"
        - "objective structured clinical examination"
        - "roleplay"
        - "role-play"
        - "standardised patient"

    nts_terms:
      primary:
        - "non-technical skills"
        - "non technical skills"
        - "nontechnical skills"
        - "NTS"
        - "communication"
        - "teamwork"
        - "leadership"
        - "decision making"
        - "decision-making"
        - "situational awareness"
      secondary:
        - "human factors"
        - "CRM"
        - "crew resource management"
        - "crisis resource management"
        - "NOTSS"
        - "ANTS"
        - "NOTECHS"
        - "soft skills"
        - "interprofessional"
        - "collaboration"
        - "closed-loop communication"
        - "cognitive load"
        - "stress management"
        - "team training"
        - "team performance"
        - "empathy"
        - "clinical reasoning"
        - "shared mental model"

    medical_terms:
      primary:
        - "healthcare"
        - "health care"
        - "medical"
        - "clinical"
        - "surgical"
        - "nursing"
        - "medical education"
      secondary:
        - "surgery"
        - "emergency"
        - "anesthesia"
        - "anaesthesia"
        - "intensive care"
        - "ICU"
        - "critical care"
        - "surgical education"
        - "healthcare education"
        - "residency"
        - "trainee"
        - "postgraduate"
        - "physician"
        - "doctor"
        - "nurse"

    urology_terms:  # For dedicated urology sub-analysis
      - "urology"
      - "urological"
      - "urologist"
