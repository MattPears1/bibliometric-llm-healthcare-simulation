      - "AUA"
      - "EAU"
      - "kidney"
      - "renal"
      - "prostate"
      - "bladder"
      - "endourology"
      - "robotic surgery"
      - "da Vinci"

# --- Data Sources ---
sources:
  openalex:
    enabled: true
    requires_auth: false
    rate_limit_seconds: 0.1  # 10 req/sec with polite pool
    max_results_per_query: 10000
    batch_size: 200
    documentation: "https://docs.openalex.org/"
    query_strategies:
      - name: "broad_llm_sim"
        query: "large language model simulation healthcare"
      - name: "chatgpt_training"
        query: "ChatGPT simulation training medical education"
      - name: "genai_nts"
        query: "generative AI non-technical skills healthcare simulation"
      - name: "llm_virtual_patient"
        query: "LLM virtual patient communication"
      - name: "ai_sim_education"
        query: "artificial intelligence simulation education clinical"
      - name: "chatgpt_medical_education"
        query: "ChatGPT medical education"
      - name: "llm_healthcare_training"
        query: "large language model healthcare training"

  pubmed:
    enabled: true
    requires_auth: false  # API key optional, increases rate to 10/sec
    rate_limit_seconds: 0.4  # 3 req/sec without key
    max_results_per_query: 10000
    batch_size: 100
    documentation: "https://www.ncbi.nlm.nih.gov/books/NBK25500/"
    query_strategies:
      - name: "llm_sim_nts"
        query: '("large language model"[TIAB] OR ChatGPT[TIAB] OR "generative AI"[TIAB] OR GPT[TIAB]) AND (simulation[TIAB] OR "simulated patient"[TIAB] OR "virtual patient"[TIAB]) AND (communication[TIAB] OR teamwork[TIAB] OR "non-technical skills"[TIAB])'
      - name: "llm_sim_medical"
        query: '("large language model"[TIAB] OR ChatGPT[TIAB] OR "generative AI"[TIAB] OR LLM[TIAB]) AND (simulation[TIAB] OR simulator[TIAB] OR debriefing[TIAB]) AND (medical[TIAB] OR healthcare[TIAB] OR clinical[TIAB])'
      - name: "chatgpt_virtual_patient"
        query: '(ChatGPT[TIAB] OR "GPT-4"[TIAB]) AND ("virtual patient"[TIAB] OR "simulated patient"[TIAB] OR "standardized patient"[TIAB])'
      - name: "genai_med_ed"
        query: '("generative AI"[TIAB] OR "generative artificial intelligence"[TIAB] OR "large language model"[TIAB]) AND ("medical education"[TIAB] OR "simulation training"[TIAB])'
      - name: "mesh_sim_ai"
        query: '"Simulation Training"[MeSH] AND "Artificial Intelligence"[MeSH]'
      - name: "broad_ai_sim"
        query: '("artificial intelligence"[TIAB] OR "AI"[TIAB]) AND ("simulation"[TIAB]) AND ("medical education"[TIAB] OR "healthcare education"[TIAB] OR "clinical education"[TIAB])'

  europepmc:
    enabled: true
    requires_auth: false
    rate_limit_seconds: 0.5
    max_results_per_query: 10000
    batch_size: 1000
    documentation: "https://europepmc.org/RestfulWebService"
    query_strategies:
      - name: "llm_sim_nts_med"
        query: '(ChatGPT OR "large language model" OR LLM OR GPT) AND (simulation OR simulator OR "virtual patient") AND (teamwork OR communication OR "non-technical skills") AND (healthcare OR medical)'
      - name: "llm_sim_broad"
        query: '(ChatGPT OR "large language model" OR "generative AI") AND (simulation OR "simulated patient") AND (medical OR healthcare OR clinical)'
      - name: "ai_med_education"
        query: '("artificial intelligence" OR ChatGPT OR LLM) AND ("medical education" OR "simulation training" OR "clinical training")'

  crossref:
    enabled: true
    requires_auth: false
    rate_limit_seconds: 1.0  # Polite delay
    max_results_per_query: 5000  # Crossref deep paging limit
    batch_size: 1000
    documentation: "https://api.crossref.org/swagger-ui/index.html"
    query_strategies:
      - name: "llm_sim_nts"
        query: "large language model simulation healthcare non-technical skills"
      - name: "chatgpt_sim_med"
        query: "ChatGPT simulation medical education training"
      - name: "genai_healthcare_sim"
        query: "generative AI healthcare simulation communication teamwork"
      - name: "ai_virtual_patient"
        query: "artificial intelligence virtual patient medical training"

  semantic_scholar:
    enabled: true
    requires_auth: true  # API key obtained 2026-03-22
    rate_limit_seconds: 1.0  # 1 req/sec with API key (was 3.5s unauthenticated)
    max_results_per_query: 1000
    batch_size: 100
    documentation: "https://api.semanticscholar.org/api-docs/"
    query_strategies:
      - name: "llm_sim_healthcare"
        query: "large language model simulation healthcare"
      - name: "chatgpt_medical_training"
        query: "ChatGPT medical education simulation training"
      - name: "genai_nts_healthcare"
        query: "generative AI non-technical skills healthcare simulation"
      - name: "llm_virtual_patient"
        query: "LLM virtual patient communication medical"
      - name: "ai_sim_teamwork"
        query: "artificial intelligence simulation teamwork clinical education"
      - name: "chatgpt_clinical_communication"
        query: "ChatGPT clinical communication skills training"
      - name: "gpt4_medical_simulation"
        query: "GPT-4 medical simulation education"
      - name: "llm_debriefing"
        query: "large language model debriefing simulation healthcare"
      - name: "ai_standardized_patient"
        query: "AI standardized patient medical education"
      - name: "chatgpt_osce"
        query: "ChatGPT OSCE clinical examination"

  core:
    enabled: true
    requires_auth: true  # API key in .env
    rate_limit_seconds: 1.0
    max_results_per_query: 10000
    batch_size: 100
    documentation: "https://api.core.ac.uk/docs/v3"
    query_strategies:
      - name: "llm_sim_healthcare"
        query: "large language model simulation healthcare"
      - name: "chatgpt_med_training"
        query: "ChatGPT medical education simulation"
      - name: "genai_clinical_sim"
        query: "generative AI clinical simulation training"

  doaj:
    enabled: true
    requires_auth: false
    rate_limit_seconds: 1.0
    max_results_per_query: 5000
    batch_size: 100
    documentation: "https://doaj.org/api/"
    query_strategies:
      - name: "llm_sim_healthcare"
        query: "large language model simulation healthcare"
      - name: "chatgpt_medical_education"
        query: "ChatGPT medical education simulation"

# --- Processing ---
processing:
  deduplication:
    doi_match: true
    fuzzy_title_threshold: 90  # rapidfuzz score 0-100
    author_year_fragment: true  # Fallback for no-DOI records
    source_priority:  # Which record to keep on duplicate
      - pubmed
      - openalex
      - europepmc
      - crossref
      - semantic_scholar
      - core
      - doaj

  screening:
    # Two-tier scope (broadest to most focused)
    tier1_requires: ["llm", "medical"]           # LLM + Medical
    tier2_requires: ["llm", "medical", "simulation"]  # + Simulation
    tier3_requires: ["llm", "medical", "simulation", "nts"]  # + NTS

    # Stage 1: Keyword pre-filter
    keyword_min_llm_matches: 1      # Must have at least 1 LLM keyword
    keyword_auto_include_threshold: 5  # Total matches across categories for auto-include
    keyword_auto_exclude_no_llm: true  # Auto-exclude if 0 LLM keywords

    # Stage 2: AI-assisted screening
    ai_screening_enabled: true
    ai_rate_limit_seconds: 2.0  # Conservative for API limits
    ai_model: "claude-sonnet-4-20250514"  # Faster + cheaper for screening
    ai_batch_size: 10  # Papers per API call (batched prompt)

  irr:
    sample_size_per_reviewer: 100
    overlap_between_reviewers: 50  # Papers reviewed by all reviewers
    target_kappa: 0.80  # Minimum acceptable Cohen's kappa

# --- Analysis ---
analysis:
  thematic_mapping:
    min_keyword_frequency: 3   # Minimum times a keyword appears to be included
    min_cooccurrence: 2        # Minimum co-occurrence count for edge
    clustering_algorithm: "louvain"
    resolution: 1.0            # Louvain resolution parameter

  figures:
    format: "png"
    dpi: 300
    style: "seaborn-v0_8-whitegrid"

# --- Pipeline ---
pipeline:
  loop_mode: false         # Set to true for continuous operation
  loop_interval_hours: 24  # Hours between collection cycles
  loop_max_days: 7         # Maximum days to run
  checkpoint_enabled: true
  max_retries_per_source: 3
  retry_backoff_base: 2    # Exponential backoff base (seconds)
  retry_backoff_max: 300   # Max backoff (5 minutes)
