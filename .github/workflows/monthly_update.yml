name: Monthly Bibliometric Update

on:
  schedule:
    # Run on the 1st of every month at 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      skip_collection:
        description: 'Skip data collection (use existing data)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  monthly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai

      - name: Create .env file
        run: |
          echo "CORE_API_KEY=${{ secrets.CORE_API_KEY }}" > .env
          echo "SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "API_CONTACT_EMAIL=${{ secrets.API_CONTACT_EMAIL }}" >> .env

      - name: Run data collection
        run: |
          cd 01_collection
          python collection_manager.py
        timeout-minutes: 60

      - name: Run processing pipeline
        run: |
          python -c "
          import sys, json, logging
          sys.path.insert(0, '02_processing')
          logging.basicConfig(level=logging.INFO)

          from normalizer import RecordNormalizer
          normalizer = RecordNormalizer()
          records = normalizer.normalize_all()
          normalizer.save(records, prefix='normalized_monthly')

          from deduplicator import Deduplicator
          dedup = Deduplicator()
          unique = dedup.deduplicate(records)
          dedup.save(unique, prefix='deduplicated_monthly')

          from screener import PaperScreener
          screener = PaperScreener()
          screener.ai_enabled = False
          results = screener.screen_all(unique)
          screener.save(results, prefix='screened_monthly')

          # Build core dataset
          included = results['included']
          medical = ['healthcare','health care','medical','clinical','surgical','surgery','nursing','hospital','patient','physician','doctor','medicine','nurse','emergency']
          llm = ['large language model','llm','chatgpt','gpt','claude','gemini','generative ai','artificial intelligence','natural language processing']

          core = [p for p in included
                  if p.get('screening_confidence') in ['high','medium']
                  and p.get('screening_tier','') in ['tier2','tier3']
                  and any(t in (p.get('title','')+' '+p.get('abstract','')).lower() for t in medical)
                  and any(t in (p.get('title','')+' '+p.get('abstract','')).lower() for t in llm)
                  and len((p.get('title','') or '').strip()) >= 15
                  and p.get('year')]

          with open('03_analysis/core_dataset.json', 'w', encoding='utf-8') as f:
              json.dump(core, f, indent=2, ensure_ascii=False)
          print(f'Core dataset: {len(core)} papers')
          "

      - name: Run all analyses
        run: |
          cd 03_analysis
          for script in publication_trends.py citation_analysis.py author_analysis.py journal_analysis.py geographic_analysis.py nts_analysis.py keyword_cooccurrence.py urology_subanalysis.py research_methods_analysis.py descriptive_stats.py llm_model_analysis.py simulation_type_analysis.py; do
            if [ -f "$script" ]; then
              python "$script" core_dataset.json 2>/dev/null || true
            fi
          done
          python -c "
          from thematic_mapping import ThematicMapper
          import json
          with open('core_dataset.json', encoding='utf-8') as f:
              papers = json.load(f)
          mapper = ThematicMapper(min_keyword_freq=5, min_cooccurrence=3)
          mapper.run(papers)
          " 2>/dev/null || true
          python prisma_diagram.py 2>/dev/null || true

      - name: Build manuscript and figure compendium
        run: |
          python 04_manuscript/build_manuscript.py
          python 04_manuscript/assemble_manuscript.py
          python build_figure_compendium.py

      - name: Generate summary report
        id: summary
        run: |
          python -c "
          import json, glob
          from datetime import datetime

          with open('03_analysis/core_dataset.json', encoding='utf-8') as f:
              papers = json.load(f)

          # Read key tables
          def latest(prefix):
              files = sorted(glob.glob(f'03_analysis/tables/{prefix}_*.md'))
              if files:
                  with open(files[-1], encoding='utf-8') as f:
                      return f.read()
              return ''

          cit = latest('citation_summary')
          h_idx = ''
          for line in cit.split('\n'):
              if 'h-index' in line:
                  h_idx = line.split('|')[-2].strip() if '|' in line else ''

          pub = latest('publication_trends')
          cagr = ''
          for line in pub.split('\n'):
              if 'CAGR' in line:
                  cagr = line.split('**')[-2] if '**' in line else line.split(':')[-1].strip()

          summary = f'''Bibliometric Monthly Update - {datetime.now().strftime(\"%B %Y\")}

          Core dataset: {len(papers)} papers
          CAGR: {cagr}
          h-index: {h_idx}
          Figures: 32 regenerated with GPT-5.1 descriptions
          Manuscript: updated and rebuilt

          View the latest at: https://github.com/MattPears1/bibliometric-llm-healthcare-simulation
          '''
          print(summary)

          with open('monthly_summary.txt', 'w') as f:
              f.write(summary)
          " 2>/dev/null

          echo "papers=$(python -c "import json; print(len(json.load(open('03_analysis/core_dataset.json',encoding='utf-8'))))")" >> $GITHUB_OUTPUT
          echo "month=$(date +'%B %Y')" >> $GITHUB_OUTPUT

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          MONTH=$(date +"%B %Y")
          PAPERS=${{ steps.summary.outputs.papers }}
          git commit -m "Monthly update: ${MONTH} - ${PAPERS} papers in core dataset" || echo "No changes to commit"
          git push

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Bibliometric Update - ${{ steps.summary.outputs.month }} - ${{ steps.summary.outputs.papers }} papers"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "Bibliometric Bot <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            Hi Matt,

            Your monthly bibliometric analysis has been automatically updated.

            Core dataset: ${{ steps.summary.outputs.papers }} papers
            Month: ${{ steps.summary.outputs.month }}

            What was done:
            - Fresh data collected from 7 databases
            - Normalised, deduplicated, and screened
            - All 15 analyses re-run, 32 figures regenerated
            - GPT-5.1 wrote descriptions for each figure
            - Manuscript and figure compendium rebuilt

            View the results: https://github.com/MattPears1/bibliometric-llm-healthcare-simulation

            If the paper count has changed significantly, consider updating
            the manuscript numbers before the next submission round.

            -- Bibliometric Bot
        continue-on-error: true

      - name: Fallback notification via GitHub Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const papers = '${{ steps.summary.outputs.papers }}';
            const month = '${{ steps.summary.outputs.month }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Monthly Update Complete: ${month} - ${papers} papers`,
              body: `## Monthly Bibliometric Update\n\n**Date:** ${month}\n**Core dataset:** ${papers} papers\n\nAll analyses, figures, and manuscript have been regenerated.\n\nCheck the latest commit for details.`,
              labels: ['automated', 'monthly-update']
            });
